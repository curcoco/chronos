name: student_workbench
description: "Chronos - 学生日常计划与金币激励应用"
publish_to: 'none'

version: 1.7.0+17

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  share_plus: ^9.0.0
  flutter_tts: ^4.0.0
  audioplayers: ^6.0.0
  archive: ^3.6.1
  flutter_slidable: ^3.1.1
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    # 运行时读取版本号:设置页「关于」展示「版本 1.1.0」
    - pubspec.yaml
