<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronos · 第二批模块原型</title>
<style>
  :root{
    --primary:#29B6F6; --primary-dark:#0288D1; --primary-light:#B3E5FC;
    --bg:#F1F8FE; --card:#FFFFFF; --text:#1F2D3D; --sub:#7B8C9D; --line:#D6EAF9;
    --red:#E53935; --green:#2E7D32; --orange:#E65100; --amber:#F9A825;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:#DCEBF7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;min-height:100vh;color:var(--text);
  }
  .phone{width:100%;max-width:420px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 50px rgba(41,182,246,.18);position:relative}
  /* 顶栏 */
  .topbar{display:flex;align-items:center;gap:2px;padding:14px 8px 6px 8px;position:relative}
  .back{background:none;border:none;font-size:24px;line-height:1;color:var(--text);padding:4px 10px;cursor:pointer;border-radius:10px}
  .back:hover{background:var(--primary-light)}
  .title{font-size:18px;font-weight:700;flex:1}
  .sub{font-size:12px;color:var(--sub);margin-right:10px}
  /* 主内容区 */
  .page{flex:1;overflow-y:auto;display:none;flex-direction:column}
  .page.active{display:flex}
  .pad{padding:12px 20px 24px}
  /* 底部导航 */
  .tabbar{display:flex;background:#fff;border-top:1px solid var(--line)}
  .tab{flex:1;background:none;border:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--sub);font-family:inherit}
  .tab.on{color:var(--primary-dark)}
  .tab .lb{font-size:10px}
  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .card h3{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .card h3 .tip{font-size:11px;font-weight:400;color:var(--sub);margin-left:auto}
  .muted{color:var(--sub);font-size:12px}
  .small{font-size:11px;color:var(--sub)}
  /* 按钮 */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:14px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--primary);color:#fff;width:100%}
  .btn.primary:hover{background:var(--primary-dark)}
  .btn.ghost{background:#fff;color:var(--primary-dark);border:1px solid var(--primary);width:100%}
  .btn.sm{width:auto;padding:7px 14px;font-size:13px;border-radius:10px}
  /* 输入 */
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;
    font-size:14px;color:var(--text);outline:none;font-family:inherit;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(41,182,246,.15)}
  textarea{resize:none}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
  /* 分类 chip */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--sub);font-size:13px;border-radius:18px;padding:6px 13px;cursor:pointer}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  /* 列表项 */
  .li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:none}
  .li .main{flex:1;min-width:0}
  .li .t{font-size:14px;line-height:1.5}
  .li .d{font-size:11px;color:var(--sub);margin-top:3px}
  .li .r{font-size:13px;font-weight:600;color:var(--sub);text-align:right}
  .li .r.up{color:var(--green)}
  .li .r.down{color:var(--red)}
  .icon-btn{background:none;border:none;color:var(--sub);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .icon-btn:hover{background:var(--bg)}
  .icon-btn.liked{color:var(--amber)}
  /* 分段 */
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:none;background:none;padding:8px;font-size:13px;color:var(--sub);border-radius:9px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--primary);color:#fff;font-weight:600}
  /* 进度条 */
  .bar{height:8px;background:#E3F0FA;border-radius:5px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--primary);border-radius:5px}
  /* 空状态 */
  .empty{text-align:center;padding:50px 30px;color:var(--sub);font-size:13px}
  /* 弹层 */
  .mask{position:absolute;inset:0;background:rgba(31,45,61,.4);z-index:50;display:flex;align-items:flex-end}
  .mask.hidden{display:none}
  .sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px 20px 24px;max-height:85%;overflow-y:auto;animation:up .2s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet h2{font-size:16px;font-weight:700;text-align:center;margin-bottom:14px}
  /* 记账头卡 */
  .hero{background:linear-gradient(135deg,var(--primary-light),var(--primary));border-radius:18px;padding:16px;color:#fff;margin-bottom:12px;box-shadow:0 6px 18px rgba(41,182,246,.25)}
  .hero .lb{font-size:12px;opacity:.9}
  .hero .amt{font-size:26px;font-weight:800;margin:2px 0 10px}
  .hero .row{display:flex;gap:16px;font-size:12px;opacity:.95}
  .hero .row b{font-size:14px}
  .budget{margin-top:10px}
  .budget .bar{background:rgba(255,255,255,.35)}
  .budget .bar i{background:#fff}
  .budget.over .bar i{background:#FFCDD2}
  .budget .bt{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;opacity:.95}
  /* 日历 */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-grid .wk{text-align:center;font-size:10px;color:var(--sub);padding:6px 0}
  .cal-grid .day{height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;cursor:pointer;position:relative}
  .cal-grid .day:hover{background:var(--primary-light)}
  .cal-grid .day .am{font-size:9px;color:var(--red);margin-top:1px}
  .cal-grid .day.today{background:var(--primary-light);font-weight:700}
  .cal-grid .day.blank{visibility:hidden}
  /* 图表 */
  .chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
  .chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
  .chart .pair{display:flex;gap:2px;align-items:flex-end;height:100%}
  .chart .b{width:9px;border-radius:3px 3px 0 0}
  .chart .b.in{background:var(--green)}
  .chart .b.out{background:var(--primary)}
  .chart .xl{font-size:10px;color:var(--sub);margin-top:2px}
  /* 调色板 */
  .toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#2B3A4D;color:#fff;font-size:13px;border-radius:12px;padding:10px 18px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:80%}
  .toast.show{opacity:1}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px}
  .mod{border:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;cursor:pointer;font-family:inherit;text-align:left}
  .mod:hover{border-color:var(--primary);box-shadow:0 4px 14px rgba(41,182,246,.15)}
  .mod .ic{width:42px;height:42px;border-radius:12px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;color:var(--primary-dark)}
  .mod .nm{font-size:15px;font-weight:700;color:var(--text)}
  .mod .ds{font-size:11px;color:var(--sub);line-height:1.4}
  .hero-title{font-size:20px;font-weight:800;padding:16px 20px 4px}
  .hero-sub{font-size:12px;color:var(--sub);padding:0 20px 8px}
  .stripe{background:var(--primary-light);color:var(--primary-dark);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:600;margin-bottom:12px}
</style>
</head>
<body>
<div class="phone">
  <!-- ===== 顶栏 ===== -->
  <div class="topbar">
    <button class="back" id="backBtn" onclick="goHome()" style="visibility:hidden">‹</button>
    <div class="title" id="pageTitle">Chronos</div>
    <span class="sub" id="pageSub"></span>
  </div>

  <!-- ===== 首页 ===== -->
  <div class="page active" id="page-home">
    <div class="hero-title">Chronos</div>
    <div class="hero-sub">第二批模块 · 纯本地 · 原型展示</div>
    <div class="home-grid">
      <button class="mod" onclick="show('review')"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-4H6v-2h4V7h2v4h4v2h-4v4z"/></svg></span><span class="nm">每日复盘</span><span class="ds">进度 / 卡点 / 明日方案</span></button>
      <button class="mod" onclick="show('english')"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg></span><span class="nm">英文积累</span><span class="ds">句 / 词 / 读 / 写 + 收藏</span></button>
      <button class="mod" onclick="show('ledger')"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg></span><span class="nm">生活记账</span><span class="ds">流水 / 日历 / 图表 / 预算</span></button>
      <button class="mod" onclick="show('inspire')"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg></span><span class="nm">灵感速记</span><span class="ds">已上线 1.4.1,待接入</span></button>
    </div>
  </div>

  <!-- ===== 每日复盘 ===== -->
  <div class="page" id="page-review">
    <div class="pad">
      <div class="stripe">今日复盘 · <span id="reviewDate"></span></div>
      <div class="card">
        <h3>今日完成进度</h3>
        <div class="chips" id="reviewProgressChips">
          <button class="chip on" data-v="100">全部完成</button>
          <button class="chip" data-v="75">大部分</button>
          <button class="chip" data-v="50">一半</button>
          <button class="chip" data-v="25">少部分</button>
          <button class="chip" data-v="0">未开始</button>
        </div>
        <div style="margin-top:10px"><textarea id="reviewDone" rows="2" placeholder="今天完成了什么…"></textarea></div>
      </div>
      <div class="card">
        <h3>遇到的问题卡点</h3>
        <textarea id="reviewProblem" rows="2" placeholder="卡在哪里…"></textarea>
      </div>
      <div class="card">
        <h3>明日优化调整方案</h3>
        <textarea id="reviewPlan" rows="2" placeholder="明天怎么调整…"></textarea>
      </div>
      <button class="btn primary" onclick="saveReview()">保存今日复盘</button>
      <div style="height:16px"></div>
      <h3 style="font-size:14px;font-weight:700;margin-bottom:8px">历史复盘</h3>
      <div id="reviewList"></div>
    </div>
  </div>

  <!-- ===== 英文积累 ===== -->
  <div class="page" id="page-english">
    <div class="pad">
      <div class="seg" id="enSeg">
        <button class="on" onclick="enTab(0)">今日</button>
        <button onclick="enTab(1)">收藏</button>
      </div>
      <div id="enToday">
        <div class="card">
          <h3>每日一句<span class="tip">收藏</span></h3>
          <div style="font-size:15px;font-weight:600;line-height:1.5" id="enQuote"></div>
          <div style="font-size:12px;color:var(--sub);margin-top:6px" id="enQuoteZh"></div>
          <div style="text-align:right"><button class="icon-btn" id="favQuote" onclick="toggleFav('quote')"><svg id="favQuoteIco" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button></div>
        </div>
        <div class="card">
          <h3>每日单词<span class="tip">点击单词收藏</span></h3>
          <div id="enWords"></div>
        </div>
        <div class="card">
          <h3>每日阅读<span class="tip">收藏</span></h3>
          <div style="font-size:13px;font-weight:600" id="enReadTitle"></div>
          <div style="font-size:13px;color:var(--sub);line-height:1.6;margin-top:6px" id="enReadText"></div>
          <div style="text-align:right"><button class="icon-btn" id="favRead" onclick="toggleFav('read')"><svg id="favReadIco" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button></div>
        </div>
        <div class="card">
          <h3>每日写作提示<span class="tip">收藏</span></h3>
          <div style="font-size:13px;line-height:1.6" id="enWrite"></div>
          <div style="text-align:right"><button class="icon-btn" id="favWrite" onclick="toggleFav('write')"><svg id="favWriteIco" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button></div>
        </div>
        <button class="btn ghost" onclick="toast('今日学习完成,金币 +2(原型示意)')">今日学习完成打卡</button>
      </div>
      <div id="enFavs" style="display:none"><div class="empty" id="enFavEmpty">还没有收藏内容,去「今日」收藏优质内容吧</div></div>
    </div>
  </div>

  <!-- ===== 生活记账 ===== -->
  <div class="page" id="page-ledger">
    <div class="pad">
      <div class="hero" id="ledgerHero"></div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn primary" style="flex:1" onclick="openEntry()">记一笔</button>
        <button class="btn ghost" style="flex:1" onclick="toast('本月记账打卡 X 天,连续记账可领金币(原型示意)')">记账打卡</button>
      </div>
      <div class="seg" id="lgSeg">
        <button class="on" onclick="lgTab(0)">明细</button>
        <button onclick="lgTab(1)">日历</button>
        <button onclick="lgTab(2)">图表</button>
        <button onclick="lgTab(3)">分类</button>
      </div>
      <div id="lgDetail">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <button class="icon-btn" onclick="lgMonth(-1)">‹</button>
          <div style="flex:1;text-align:center;font-size:14px;font-weight:600" id="lgMonthLabel"></div>
          <button class="icon-btn" onclick="lgMonth(1)">›</button>
        </div>
        <div id="lgList"></div>
      </div>
      <div id="lgCal" style="display:none">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <button class="icon-btn" onclick="calMonth(-1)">‹</button>
          <div style="flex:1;text-align:center;font-size:14px;font-weight:600" id="calMonthLabel"></div>
          <button class="icon-btn" onclick="calMonth(1)">›</button>
        </div>
        <div class="card"><div class="cal-grid" id="calGrid"></div></div>
        <div id="calDayDetail"></div>
      </div>
      <div id="lgChart" style="display:none">
        <div class="card"><h3>近7天收支</h3><div class="chart" id="lgChartBars"></div><div style="display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--sub)"><span><i style="display:inline-block;width:8px;height:8px;background:var(--green);border-radius:2px;margin-right:4px"></i>收入</span><span><i style="display:inline-block;width:8px;height:8px;background:var(--primary);border-radius:2px;margin-right:4px"></i>支出</span></div></div>
        <div class="card"><h3>本月汇总</h3><div id="lgSummary" class="muted" style="line-height:1.8"></div></div>
      </div>
      <div id="lgCats" style="display:none">
        <div class="card"><h3>预设分类</h3><div class="chips" id="lgCatPreset"></div></div>
        <div class="card"><h3>自定义分类</h3><div class="chips" id="lgCatCustom"></div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <input type="text" id="lgNewCat" placeholder="新分类名称" style="flex:1">
            <button class="btn sm primary" onclick="addCustomCat()">添加</button>
          </div>
        </div>
        <div class="card"><h3>月度预算</h3>
          <div style="display:flex;gap:8px">
            <input type="number" id="lgBudgetInput" placeholder="输入预算金额" style="flex:1" min="0">
            <button class="btn sm primary" onclick="setBudget()">设置</button>
          </div>
          <div class="small" style="margin-top:8px" id="lgBudgetState"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 灵感速记占位 ===== -->
  <div class="page" id="page-inspire">
    <div class="pad">
      <div class="stripe">灵感速记</div>
      <div class="card"><h3>已完成</h3><p class="muted" style="line-height:1.7">灵感速记(快速记录)、历史记录检索、详情分享/删除已于 1.4.1 上线。第二批其余模块移植后将与速记页互相衔接。</p></div>
    </div>
  </div>

  <!-- ===== 记账弹层:记一笔 ===== -->
  <div class="mask hidden" id="entryMask">
    <div class="sheet">
      <h2>记一笔</h2>
      <div class="seg" id="entryType">
        <button class="on" onclick="entryType(0)">支出</button>
        <button onclick="entryType(1)">收入</button>
      </div>
      <div class="field"><label>金额</label><input type="number" id="entryAmount" placeholder="0.00" min="0" step="0.01"></div>
      <div class="field"><label>分类</label><div class="chips" id="entryCats"></div></div>
      <div class="field"><label>日期</label><input type="date" id="entryDate"></div>
      <div class="field"><label>备注</label><input type="text" id="entryNote" placeholder="选填"></div>
      <button class="btn primary" onclick="saveEntry()">保存</button>
      <div style="height:8px"></div>
      <button class="btn ghost" onclick="closeEntry()">取消</button>
    </div>
  </div>

  <!-- ===== 底部导航 ===== -->
  <div class="tabbar">
    <button class="tab on" data-m="home"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span class="lb">首页</span></button>
    <button class="tab" data-m="review"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-4H6v-2h4V7h2v4h4v2h-4v4z"/></svg><span class="lb">复盘</span></button>
    <button class="tab" data-m="english"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg><span class="lb">英文</span></button>
    <button class="tab" data-m="ledger"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg><span class="lb">记账</span></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600);}
const today0=new Date();today0.setHours(0,0,0,0);
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dstrCn(d){return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';}
function daysAgo(n){const x=new Date(today0);x.setDate(x.getDate()-n);return x;}
const money=n=>'¥'+(Number(n)||0).toFixed(2);

/* ============ 页面切换 ============ */
let currentPage='home';
function show(id){
  currentPage=id;
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+id));
  $('backBtn').style.visibility=(id==='home')?'hidden':'visible';
  const titles={home:'Chronos',review:'每日复盘',english:'英文积累',ledger:'生活记账',inspire:'灵感速记'};
  $('pageTitle').textContent=titles[id]||'Chronos';
  $('pageSub').textContent=id==='home'?'第二批模块 · 纯本地':'';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m===id));
  if(id==='review')renderReview();
  if(id==='english')renderEn();
  if(id==='ledger'){renderLedger();renderLg();}
}
function goHome(){show('home');}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.m));

/* ============ 每日复盘 ============ */
let reviews=[];
(function(){ // 示例:近两天复盘
  reviews.push({date:dstr(daysAgo(1)),p:75,done:'背完 30 个单词;完成高数第三章习题',problem:'卡在不定积分换元法,反应慢',plan:'先看例题再动手,限时 40 分钟'});
  reviews.push({date:dstr(daysAgo(2)),p:50,done:'读完一章《原子习惯》;跑步 3 公里',problem:'晚上刷手机到 12 点,睡太晚',plan:'手机放客厅,23:30 前上床'});
})();
let reviewP=100;
function renderReview(){
  $('reviewDate').textContent=dstrCn(today0);
  const list=$('reviewList');
  if(reviews.length===0){list.innerHTML='<div class="empty">还没有复盘记录</div>';return;}
  list.innerHTML=reviews.map((r,i)=>{
    const label=r.p>=75?'大部分':r.p>=50?'一半':r.p>=25?'少部分':'未开始';
    return '<div class="card" style="cursor:pointer" onclick="toggleRev('+i+')">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:13px;font-weight:700">'+r.date+'</span><span class="small">完成度 '+r.p+'% · '+label+'</span></div>'+
      '<div class="bar"><i style="width:'+r.p+'%"></i></div>'+
      '<div class="rev-detail" style="display:none;margin-top:10px;font-size:13px;color:var(--sub);line-height:1.7">'+
      '<b style="color:var(--text)">完成:</b>'+r.done+'<br><b style="color:var(--text)">卡点:</b>'+r.problem+'<br><b style="color:var(--text)">明日方案:</b>'+r.plan+'</div>'+
      '<div class="small" style="margin-top:8px">点击展开详情</div></div>';
  }).join('');
}
function toggleRev(i){const el=document.querySelectorAll('.rev-detail')[i];el.style.display=el.style.display==='none'?'block':'none';}
document.querySelectorAll('#reviewProgressChips .chip').forEach(c=>c.onclick=()=>{
  reviewP=+c.dataset.v;
  document.querySelectorAll('#reviewProgressChips .chip').forEach(x=>x.classList.toggle('on',x===c));
});
function saveReview(){
  const done=$('reviewDone').value.trim(),problem=$('reviewProblem').value.trim(),plan=$('reviewPlan').value.trim();
  if(!done&&!problem&&!plan){toast('写点什么再保存吧');return;}
  reviews.unshift({date:dstr(today0),p:reviewP,done:done||'—',problem:problem||'—',plan:plan||'—'});
  $('reviewDone').value='';$('reviewProblem').value='';$('reviewPlan').value='';
  renderReview();toast('已保存今日复盘');
}

/* ============ 英文积累 ============ */
const enData={
  quote:{en:'The secret of getting ahead is getting started.',zh:'领先的秘诀,就是开始行动。'},
  words:[{w:'persevere',p:'/ˌpɜːrsəˈvɪr/',m:'v. 坚持不懈'},{w:'curiosity',p:'/ˌkjʊriˈɑːsəti/',m:'n. 好奇心'},{w:'insight',p:'/ˈɪnsaɪt/',m:'n. 洞察力'},{w:'momentum',p:'/moʊˈmentəm/',m:'n. 势头'},{w:'discipline',p:'/ˈdɪsəplɪn/',m:'n. 自律'}],
  read:{title:'A Small Step, Every Day',text:'Progress is rarely dramatic. It is the sum of small, consistent efforts. Open the book, write one line, walk one more minute — and let the routine carry you forward.'},
  write:'用一句话描述「今天最想改变的一个小习惯」,并写下第一步。'
};
let favs={quote:false,read:false,write:false,words:{}};
function renderEn(){
  $('enQuote').textContent=enData.quote.en;
  $('enQuoteZh').textContent=enData.quote.zh;
  $('enReadTitle').textContent=enData.read.title;
  $('enReadText').textContent=enData.read.text;
  $('enWrite').textContent=enData.write;
  $('enWords').innerHTML=enData.words.map((w,i)=>
    '<div class="li"><div class="main"><div class="t" style="font-weight:600">'+w.w+' <span class="muted" style="font-weight:400">'+w.p+'</span></div><div class="d">'+w.m+'</div></div>'+
    '<button class="icon-btn'+(favs.words[i]?' liked':'')+'" onclick="toggleWord('+i+')"><svg viewBox="0 0 24 24" width="18" height="18" fill="'+(favs.words[i]?'#F9A825':'none')+'" stroke="currentColor" stroke-width="1.8"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button></div>'
  ).join('');
  ['quote','read','write'].forEach(k=>{
    const el=$('fav'+k[0].toUpperCase()+k.slice(1));
    el.classList.toggle('liked',!!favs[k]);
    el.querySelector('svg').setAttribute('fill',favs[k]?'#F9A825':'none');
  });
  renderEnFavs();
}
function toggleFav(k){favs[k]=!favs[k];renderEn();toast(favs[k]?'已收藏':'已取消收藏');}
function toggleWord(i){favs.words[i]=!favs.words[i];renderEn();toast(favs.words[i]?'已收藏单词':'已取消收藏');}
function enTab(i){$('enSeg').querySelectorAll('button').forEach((b,x)=>b.classList.toggle('on',x===i));$('enToday').style.display=i===0?'block':'none';$('enFavs').style.display=i===1?'block':'none';}
function renderEnFavs(){
  const items=[];
  if(favs.quote)items.push({type:'每日一句',t:enData.quote.en});
  if(favs.read)items.push({type:'每日阅读',t:enData.read.title});
  if(favs.write)items.push({type:'写作提示',t:enData.write});
  enData.words.forEach((w,i)=>{if(favs.words[i])items.push({type:'单词',t:w.w+' '+w.m});});
  $('enFavEmpty').style.display=items.length?'none':'block';
  $('enFavs').innerHTML=(items.length?items.map(x=>'<div class="card"><h3 style="margin-bottom:4px">'+x.type+'</h3><div style="font-size:13px;line-height:1.6">'+x.t+'</div></div>').join(''):'')+'<div class="empty" id="enFavEmpty" '+(items.length?'style="display:none"':'')+'>还没有收藏内容,去「今日」收藏优质内容吧</div>';
}

/* ============ 生活记账 ============ */
let startBalance=500;
let budget=0;
const presetCats={expense:['餐饮','交通','购物','学习','娱乐','医疗','其他'],income:['零花钱','兼职','红包','其他']};
let customCats=[];
let txns=[];
(function(){ // 示例流水
  const mk=(type,category,amount,note,daysAgoV)=>({id:txns.length+1,type,category,amount:+amount.toFixed(2),note,date:dstr(daysAgo(daysAgoV))});
  txns.push(mk('expense','餐饮',32.5,'午饭',0));
  txns.push(mk('expense','交通',6,'地铁',0));
  txns.push(mk('income','兼职',200,'家教',0));
  txns.push(mk('expense','学习',45.9,'买书',1));
  txns.push(mk('expense','餐饮',28,'晚餐',1));
  txns.push(mk('expense','娱乐',30,'电影票',2));
  txns.push(mk('expense','购物',89,'日用品',2));
  txns.push(mk('income','零花钱',100,'妈妈转账',2));
  txns.push(mk('expense','餐饮',18.5,'早餐',3));
  txns.push(mk('expense','交通',6,'地铁',4));
  txns.push(mk('expense','学习',120,'课程资料',5));
  txns.push(mk('income','红包',50,'春节红包',6));
})();
let entryIsExpense=true;
let curLgMonth=0,curCalMonth=0;
function monthLabel(d){return d.getFullYear()+'年'+(d.getMonth()+1)+'月';}
function sumOf(list,type){return list.filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0);}
function renderLedger(){
  const income=sumOf(txns,'income'),expense=sumOf(txns,'expense');
  const bal=startBalance+income-expense;
  const mNow=new Date();const mKey=mNow.getFullYear()+'-'+String(mNow.getMonth()+1).padStart(2,'0');
  const mExp=sumOf(txns.filter(t=>t.date.startsWith(mKey)),'expense');
  const pct=budget>0?Math.round(mExp/budget*100):0;
  $('ledgerHero').innerHTML=
    '<div class="lb">余额(起始 '+money(startBalance)+')</div><div class="amt">'+money(bal)+'</div>'+
    '<div class="row"><span>本月收入 <b>'+money(sumOf(txns.filter(t=>t.date.startsWith(mKey)),'income'))+'</b></span><span>本月支出 <b>'+money(mExp)+'</b></span></div>'+
    (budget>0?'<div class="budget '+(pct>=100?'over':'')+'"><div class="bt"><span>月度预算 '+money(budget)+'</span><span>'+(pct>=100?'已超支!':'已用 '+pct+'%')+'</span></div><div class="bar"><i style="width:'+Math.min(100,pct)+'%"></i></div></div>':'<div class="budget"><div class="bt"><span>未设置月度预算</span></div></div>');
  $('lgBudgetState').textContent=budget>0?'当前预算 '+money(budget)+' / 月':'尚未设置预算,设置后超支会预警';
  $('lgBudgetInput').value=budget>0?budget:'';
  renderLgCats();
}
function renderLg(){
  renderDetail();renderCal();renderChart();
}
function lgTab(i){$('lgSeg').querySelectorAll('button').forEach((b,x)=>b.classList.toggle('on',x===i));
  ['lgDetail','lgCal','lgChart','lgCats'].forEach((id,x)=>$(id).style.display=x===i?'block':'none');}
function lgMonth(d){const base=new Date(today0);base.setDate(1);base.setMonth(base.getMonth()+curLgMonth+d);curLgMonth+=d;renderDetail();}
function renderDetail(){
  const base=new Date(today0);base.setDate(1);base.setMonth(base.getMonth()+curLgMonth);
  const key=base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0');
  $('lgMonthLabel').textContent=monthLabel(base);
  const list=txns.filter(t=>t.date.startsWith(key)).sort((a,b)=>b.date.localeCompare(a.date));
  if(list.length===0){$('lgList').innerHTML='<div class="empty">本月暂无记录</div>';return;}
  const groups={};
  list.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t);});
  $('lgList').innerHTML=Object.entries(groups).map(([d,arr])=>{
    const dd=new Date(d+'T00:00:00');
    return '<div class="small" style="margin:8px 0 2px;font-weight:600">'+dstrCn(dd)+'</div>'+arr.map(t=>
      '<div class="li"><div class="main"><div class="t">'+t.category+(t.note?' · '+t.note:'')+'</div><div class="d">'+(t.type==='income'?'收入':'支出')+'</div></div><div class="r '+(t.type==='income'?'up':'down')+'">'+(t.type==='income'?'+':'−')+money(t.amount)+'</div></div>'
    ).join('');
  }).join('');
}
function calMonth(d){const base=new Date(today0);base.setDate(1);base.setMonth(base.getMonth()+curCalMonth+d);curCalMonth+=d;renderCal();}
function renderCal(){
  const base=new Date(today0);base.setDate(1);base.setMonth(base.getMonth()+curCalMonth);
  $('calMonthLabel').textContent=monthLabel(base);
  const key=base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0');
  const first=new Date(base.getFullYear(),base.getMonth(),1);
  const days=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  let html='<div class="wk">日</div><div class="wk">一</div><div class="wk">二</div><div class="wk">三</div><div class="wk">四</div><div class="wk">五</div><div class="wk">六</div>';
  for(let i=0;i<first.getDay();i++)html+='<div class="day blank"></div>';
  for(let d=1;d<=days;d++){
    const dk=key+'-'+String(d).padStart(2,'0');
    const dayTx=txns.filter(t=>t.date===dk);
    const exp=sumOf(dayTx,'expense');
    const isToday=dk===dstr(today0);
    html+='<div class="day'+(isToday?' today':'')+'" onclick="calDay(\''+dk+'\')">'+d+(exp>0?'<span class="am">'+Math.round(exp)+'</span>':'')+'</div>';
  }
  $('calGrid').innerHTML=html;
}
function calDay(dk){
  const dayTx=txns.filter(t=>t.date===dk);
  if(dayTx.length===0){$('calDayDetail').innerHTML='';return;}
  $('calDayDetail').innerHTML='<div class="card" style="margin-top:10px"><h3>'+dstrCn(new Date(dk+'T00:00:00'))+'</h3>'+dayTx.map(t=>'<div class="li"><div class="main"><div class="t">'+t.category+(t.note?' · '+t.note:'')+'</div></div><div class="r '+(t.type==='income'?'up':'down')+'">'+(t.type==='income'?'+':'−')+money(t.amount)+'</div></div>').join('')+'</div>';
}
function renderChart(){
  const out=[],inn=[];
  for(let i=6;i>=0;i--){
    const dk=dstr(daysAgo(i));
    const dayTx=txns.filter(t=>t.date===dk);
    out.push(sumOf(dayTx,'expense'));inn.push(sumOf(dayTx,'income'));
  }
  const max=Math.max(...out,...inn,1);
  let html='';
  for(let i=0;i<7;i++){
    const oh=Math.round(out[i]/max*110),ih=Math.round(inn[i]/max*110);
    html+='<div class="col"><div class="pair"><div class="b in" style="height:'+ih+'px"></div><div class="b out" style="height:'+oh+'px"></div></div><div class="xl">'+(i===6?'今天':i===5?'昨天':(6-i)+'天前')+'</div></div>';
  }
  $('lgChartBars').innerHTML=html;
  const mNow=new Date();const mk=mNow.getFullYear()+'-'+String(mNow.getMonth()+1).padStart(2,'0');
  const mTx=txns.filter(t=>t.date.startsWith(mk));
  $('lgSummary').innerHTML='本月收入 <b style="color:var(--green)">'+money(sumOf(mTx,'income'))+'</b><br>本月支出 <b style="color:var(--red)">'+money(sumOf(mTx,'expense'))+'</b><br>本月结余 <b>'+money(sumOf(mTx,'income')-sumOf(mTx,'expense'))+'</b>';
}
function renderLgCats(){
  $('lgCatPreset').innerHTML=presetCats.expense.concat(presetCats.income).map(c=>'<span class="chip" style="cursor:default">'+c+'</span>').join('');
  $('lgCatCustom').innerHTML=customCats.length?customCats.map((c,i)=>'<span class="chip" style="cursor:default">'+c+' <b onclick="delCat('+i+')" style="cursor:pointer;margin-left:4px">×</b></span>').join(''):'<span class="small">暂无自定义分类</span>';
}
function addCustomCat(){
  const v=$('lgNewCat').value.trim();
  if(!v){toast('请输入分类名称');return;}
  if(customCats.includes(v)){toast('分类已存在');return;}
  customCats.push(v);$('lgNewCat').value='';renderLgCats();toast('已添加分类');
}
function delCat(i){customCats.splice(i,1);renderLgCats();}
function setBudget(){
  const v=Math.max(0,+$('lgBudgetInput').value||0);
  budget=v;renderLedger();toast(v>0?'预算已设为 '+money(v):'已取消预算');
}
/* 记一笔 */
function openEntry(){
  entryIsExpense=true;
  $('entryType').querySelectorAll('button').forEach((b,x)=>b.classList.toggle('on',x===0));
  renderEntryCats();
  $('entryDate').value=dstr(today0);
  $('entryAmount').value='';$('entryNote').value='';
  $('entryMask').classList.remove('hidden');
}
function closeEntry(){$('entryMask').classList.add('hidden');}
function entryType(i){entryIsExpense=i===0;$('entryType').querySelectorAll('button').forEach((b,x)=>b.classList.toggle('on',x===i));renderEntryCats();}
function renderEntryCats(){
  const cats=presetCats[entryIsExpense?'expense':'income'].concat(customCats);
  $('entryCats').innerHTML=cats.map((c,i)=>'<button class="chip'+(i===0?' on':'')+'" data-c="'+c+'" onclick="pickEntryCat(this)">'+c+'</button>').join('');
}
function pickEntryCat(el){document.querySelectorAll('#entryCats .chip').forEach(x=>x.classList.toggle('on',x===el));}
function saveEntry(){
  const amt=+$('entryAmount').value;
  if(!(amt>0)){toast('请输入有效金额');return;}
  const catEl=document.querySelector('#entryCats .chip.on');
  const cat=catEl?catEl.dataset.c:'其他';
  const date=$('entryDate').value||dstr(today0);
  const note=$('entryNote').value.trim();
  txns.push({id:txns.length+1,type:entryIsExpense?'expense':'income',category:cat,amount:+amt.toFixed(2),note,date});
  closeEntry();renderLedger();renderLg();toast('已记一笔');
}
renderLedger();renderLg();
</script>
</body>
</html>
